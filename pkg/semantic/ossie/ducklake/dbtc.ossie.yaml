            dimension:
              is_time: true
          - name: "event_time"
            description: "Telemetry observation timestamp"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_time"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "route_id"
            description: "Route identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_id"
          - name: "trip_id"
            description: "Trip identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "trip_id"
          - name: "station_id"
            description: "Station identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "vehicle_id"
            description: "Vehicle identifier"
            datatype: "VARCHAR"
