          - "agency_id"
          - "route_id"
          - "trip_id"
          - "from_station_id"
          - "to_station_id"
        fields:
          - name: "event_date"
            description: "Partition date"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "route_id"
            description: "Route identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_id"
          - name: "route_name"
            description: "Commercial route name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_name"
          - name: "trip_id"
            description: "Trip identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "trip_id"
          - name: "vehicle_id"
            description: "Vehicle identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "vehicle_id"
          - name: "from_station_id"
            description: "Origin stop identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "from_station_id"
          - name: "to_station_id"
            description: "Destination stop identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "to_station_id"
          - name: "departure_time"
            description: "Timestamp of departure from origin stop"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "departure_time"
            dimension:
              is_time: true
          - name: "arrival_time"
            description: "Timestamp of arrival at destination stop"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "arrival_time"
            dimension:
              is_time: true
          - name: "leg_travel_time_sec"
            description: "Travel duration across leg in seconds"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "leg_travel_time_sec"
          - name: "leg_distance_meters"
            description: "Great-circle distance across leg in meters"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "leg_distance_meters"
          - name: "leg_speed_mps"
            description: "Calculated leg velocity in meters per second"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
