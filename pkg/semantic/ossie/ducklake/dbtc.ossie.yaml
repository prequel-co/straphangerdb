version: "0.2.0.dev0"
semantic_model:
  - name: "dbtc"
    description: "Unified DBTC (NYC Transit Studio) semantic model combining rail operations, surface kinematics, schedule adherence, station demand, origin-destination ridership, micromobility, and service lines for all default studio cells."
    ai_context:
      instructions: "Primary semantic model for NYC Transit Studio (DBTC). Combines station_headways, station_to_station_legs, current_vehicle_positions, vehicle_kinematics, schedule_adherence, station_hourly_summary, turnstile_flows, fact_ridership, fact_micromobility_status, alert_routes, alert_stations, and all spatial/station/route dimensions. Always pass an explicit event_date partition filter in the 4th argument of ossie_query('dbtc', '<dataset>', '<dimensions>', '<event_date_filter>') (e.g. event_date = (CURRENT_DATE - INTERVAL '1 day')::DATE for daily vehicle/schedule/micromobility telemetry, event_date >= DATE '2026-10-29' for turnstile_flows, and event_date = DATE '2025-04-07' for fact_ridership) so DuckLake prunes Parquet partitions before execution."
    datasets:
      - name: "station_headways"
        description: "Calculated headway intervals between consecutive trains at stations (drives Station Progression and Headway Horizon cells)"
        source: "prod.transit_v2.view_station_headways"
        primary_key:
          - "event_date"
          - "agency_id"
          - "route_id"
          - "trip_id"
          - "station_id"
          - "event_time"
        fields:
          - name: "event_date"
            description: "Partition date of the observed train event"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "event_time"
            description: "Timestamp of train arrival or presence at station"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_time"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Transit agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "route_id"
            description: "Transit route identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_id"
          - name: "trip_id"
            description: "GTFS trip identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "trip_id"
          - name: "vehicle_id"
            description: "Physical vehicle identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "vehicle_id"
          - name: "station_id"
            description: "Station platform identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "parent_station_id"
            description: "Normalized parent station identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "parent_station_id"
          - name: "direction_id"
            description: "Train direction (N, S, or ALL)"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "direction_id"
          - name: "status"
            description: "Vehicle status at station"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "status"
          - name: "headway_sec"
            description: "Observed headway gap in seconds from preceding train"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "headway_sec"
          - name: "headway_sec_squared"
            description: "Squared headway for computing sample variance"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "headway_sec_squared"

      - name: "station_to_station_legs"
        description: "Point-to-point transit link segments between consecutive stations (drives Marey Diagram, Route Segment Speed Map, Adherence Waterfall, and Isochrone Reachability cells)"
