          - name: "latitude"
            description: "GPS latitude"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "latitude"
          - name: "longitude"
            description: "GPS longitude"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "longitude"
          - name: "bearing"
            description: "Compass bearing degrees"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "bearing"
          - name: "effective_speed_mps"
