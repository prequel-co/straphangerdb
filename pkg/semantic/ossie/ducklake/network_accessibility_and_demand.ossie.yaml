version: "0.2.0.dev0"
semantic_model:
  - name: "network_accessibility_and_demand"
    description: "Network Accessibility and Demand semantic model covering fare gate entries/exits, payment methods, complex interchanges, and passenger ridership."
    ai_context:
      instructions: "Query turnstile_flows and fact_ridership for passenger demand and accessibility analysis. Always filter by event_date to prune partition files."
    datasets:
      - name: "turnstile_flows"
        description: "Fare gate transactions categorized by payment method and fare class"
        source: "prod.transit_v2.view_turnstile_flows"
        primary_key:
          - "event_date"
          - "agency_id"
          - "station_id"
          - "device_id"
          - "reading_time"
        fields:
          - name: "event_date"
            description: "Partition date"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Operating agency"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "station_id"
            description: "Station identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "device_id"
            description: "Turnstile device identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "device_id"
          - name: "reading_time"
            description: "Hardware reading timestamp"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "reading_time"
            dimension:
              is_time: true
          - name: "service_hour"
            description: "Truncated service hour in America/New_York"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "service_hour"
            dimension:
              is_time: true
          - name: "entry_count"
            description: "Incremental turnstile entries"
            datatype: "BIGINT"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "entry_count"
          - name: "exit_count"
            description: "Incremental turnstile exits"
            datatype: "BIGINT"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "exit_count"
          - name: "payment_method"
            description: "Payment method (e.g. OMNY Contactless, MetroCard)"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "payment_method"
          - name: "fare_class_category"
            description: "Fare class (Full Fare, Senior/Disabled, Student, Fair Fares)"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "fare_class_category"

      - name: "fact_ridership"
        description: "Passenger origin-destination ridership counts"
        source: "prod.transit_v2.fact_ridership"
        primary_key:
          - "event_date"
          - "agency_id"
          - "origin_station_id"
          - "destination_station_id"
        fields:
          - name: "event_date"
            description: "Partition date"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "origin_station_id"
            description: "Origin station ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "origin_station_id"
          - name: "destination_station_id"
            description: "Destination station ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "destination_station_id"
          - name: "passenger_count"
            description: "Aggregated passenger volume"
            datatype: "BIGINT"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "passenger_count"

      - name: "station_complexes"
        description: "Aggregated station complexes unifying multiple platform structures"
        source: "prod.transit_v2.view_station_complexes"
        primary_key:
          - "complex_id"
          - "agency_id"
        fields:
          - name: "complex_id"
            description: "Unique complex identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "complex_id"
          - name: "agency_id"
            description: "Agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "complex_name"
            description: "Representative complex name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "complex_name"
          - name: "latitude"
            description: "Centroid latitude"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "latitude"
          - name: "longitude"
            description: "Centroid longitude"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "longitude"
          - name: "daytime_routes"
            description: "Aggregated routes serving this complex"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "daytime_routes"
          - name: "is_accessible"
            description: "Whether any platform in complex is ADA accessible"
            datatype: "BOOLEAN"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "is_accessible"
          - name: "station_count"
            description: "Count of platforms in complex"
            datatype: "BIGINT"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_count"
          - name: "route_count"
            description: "Count of distinct routes connected"
            datatype: "BIGINT"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_count"

      - name: "station_to_station_legs"
        description: "Link segments connecting consecutive stations"
        source: "prod.transit_v2.view_station_to_station_legs"
        primary_key:
          - "event_date"
          - "agency_id"
          - "route_id"
          - "trip_id"
          - "from_station_id"
          - "to_station_id"
        fields:
          - name: "event_date"
            description: "Partition date"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "route_id"
            description: "Route identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_id"
          - name: "route_name"
            description: "Commercial route name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_name"
          - name: "trip_id"
            description: "Trip identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "trip_id"
          - name: "from_station_id"
            description: "Origin station"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "from_station_id"
          - name: "to_station_id"
            description: "Destination station"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "to_station_id"
          - name: "leg_travel_time_sec"
            description: "Leg travel time in seconds"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "leg_travel_time_sec"
          - name: "leg_distance_meters"
            description: "Great-circle distance across leg in meters"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "leg_distance_meters"

      - name: "dim_stations"
        description: "SCD-safe dimension view of current transit stations"
        source: "prod.transit_v2.view_dim_stations"
        primary_key:
          - "gtfs_stop_id"
          - "agency_id"
        fields:
          - name: "station_id"
            description: "Station ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "gtfs_stop_id"
            description: "GTFS stop identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "gtfs_stop_id"
          - name: "agency_id"
            description: "Agency ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "name"
            description: "Station name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "name"
          - name: "latitude"
            description: "Latitude"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "latitude"
          - name: "longitude"
            description: "Longitude"
            datatype: "DOUBLE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "longitude"
          - name: "complex_id"
            description: "Associated complex identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "complex_id"
          - name: "is_accessible"
            description: "ADA accessibility flag"
            datatype: "BOOLEAN"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "is_accessible"

      - name: "dim_routes"
        description: "SCD-safe dimension view of current transit lines and routes"
        source: "prod.transit_v2.view_dim_routes"
        primary_key:
          - "route_id"
          - "agency_id"
        fields:
          - name: "route_id"
            description: "Route identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_id"
          - name: "agency_id"
            description: "Agency identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "route_name"
            description: "Commercial route name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_name"
          - name: "color_hex"
            description: "Hexadecimal route branding color"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "color_hex"
          - name: "type"
            description: "GTFS route type"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "type"

    relationships:
      - name: "turnstiles_to_station_complexes"
        from: "turnstile_flows"
        to: "station_complexes"
        from_columns:
          - "station_id"
          - "agency_id"
        to_columns:
          - "complex_id"
          - "agency_id"
        type: "many_to_one"
      - name: "stations_to_complex"
        from: "dim_stations"
        to: "station_complexes"
        from_columns:
          - "complex_id"
          - "agency_id"
        to_columns:
          - "complex_id"
          - "agency_id"
        type: "many_to_one"
      - name: "ridership_to_origin_complex"
        from: "fact_ridership"
        to: "station_complexes"
        from_columns:
          - "origin_station_id"
          - "agency_id"
        to_columns:
          - "complex_id"
          - "agency_id"
        type: "many_to_one"
      - name: "legs_to_origin_station"
        from: "station_to_station_legs"
        to: "dim_stations"
        from_columns:
          - "from_station_id"
          - "agency_id"
        to_columns:
          - "gtfs_stop_id"
          - "agency_id"
        type: "many_to_one"
      - name: "legs_to_dim_routes"
        from: "station_to_station_legs"
        to: "dim_routes"
        from_columns:
          - "route_id"
          - "agency_id"
        to_columns:
          - "route_id"
          - "agency_id"
        type: "many_to_one"

    metrics:
      - name: "network_turnstile_entries"
        description: "Network-wide total turnstile entries"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "SUM(turnstile_flows.entry_count)"
      - name: "total_entries"
        description: "Total turnstile passenger entries"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "SUM(turnstile_flows.entry_count)"
      - name: "total_exits"
        description: "Total turnstile passenger exits"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "SUM(turnstile_flows.exit_count)"
      - name: "net_flow"
        description: "Net passenger inflow (entries minus exits)"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "SUM(turnstile_flows.entry_count) - SUM(turnstile_flows.exit_count)"
      - name: "total_passengers"
        description: "Total passenger volume across OD pairs"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "SUM(fact_ridership.passenger_count)"
      - name: "avg_leg_distance_meters"
        description: "Average great-circle distance between consecutive station stops in meters"
        datatype: "DOUBLE"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "AVG(station_to_station_legs.leg_distance_meters) FILTER (WHERE station_to_station_legs.leg_distance_meters > 0)"
