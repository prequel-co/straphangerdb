version: "0.2.0.dev0"
semantic_model:
  - name: "service_reliability_and_micromobility"
    description: "Vendor-agnostic ANSI SQL Service Reliability and Micromobility model targeting Apache Iceberg tables."
    ai_context:
      instructions: "Query fact_alerts and fact_micromobility_status with event_date partition filter."
    datasets:
      - name: "fact_alerts"
        description: "Service alerts base fact table"
        source: "iceberg.transit_v2.fact_alerts"
        primary_key:
          - "event_date"
          - "alert_id"
          - "agency_id"
        fields:
          - name: "event_date"
            description: "Partition date"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "alert_id"
            description: "Alert ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "alert_id"
          - name: "agency_id"
            description: "Agency ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "detected_at"
            description: "Detected timestamp"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "detected_at"
            dimension:
              is_time: true
          - name: "affected_route_ids"
            description: "Comma-delimited route IDs"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "affected_route_ids"
          - name: "cause"
            description: "Disruption cause"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "cause"
          - name: "effect"
            description: "Disruption effect"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "effect"
          - name: "severity"
            description: "Severity"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "severity"

      - name: "fact_micromobility_status"
        description: "Micromobility dock status telemetry"
        source: "iceberg.transit_v2.fact_micromobility_status"
        primary_key:
          - "event_date"
          - "agency_id"
          - "station_id"
          - "event_time"
        fields:
          - name: "event_date"
            description: "Partition date"
            datatype: "DATE"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_date"
            dimension:
              is_time: true
          - name: "event_time"
            description: "Observation timestamp"
            datatype: "TIMESTAMP"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "event_time"
            dimension:
              is_time: true
          - name: "agency_id"
            description: "Agency ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "station_id"
            description: "Station ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "num_bikes_available"
            description: "Available bikes"
            datatype: "INTEGER"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "num_bikes_available"
          - name: "num_ebikes_available"
            description: "Available e-bikes"
            datatype: "INTEGER"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "num_ebikes_available"
          - name: "num_docks_available"
            description: "Empty docks"
            datatype: "INTEGER"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "num_docks_available"

      - name: "dim_micromobility_stations"
        description: "Micromobility stations dimension"
        source: "iceberg.transit_v2.dim_micromobility_stations"
        primary_key:
          - "station_id"
          - "agency_id"
        fields:
          - name: "station_id"
            description: "Station ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "agency_id"
            description: "Agency ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "name"
            description: "Dock name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "name"
          - name: "capacity"
            description: "Capacity"
            datatype: "INTEGER"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "capacity"

      - name: "dim_stations"
        description: "SCD Type II transit stations"
        source: "iceberg.transit_v2.dim_stations"
        primary_key:
          - "gtfs_stop_id"
          - "agency_id"
        fields:
          - name: "station_id"
            description: "Station ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "station_id"
          - name: "agency_id"
            description: "Agency ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "name"
            description: "Station name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "name"
          - name: "gtfs_stop_id"
            description: "GTFS stop identifier"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "gtfs_stop_id"

      - name: "dim_routes"
        description: "SCD Type II transit routes"
        source: "iceberg.transit_v2.dim_routes"
        primary_key:
          - "route_id"
          - "agency_id"
        fields:
          - name: "route_id"
            description: "Route ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_id"
          - name: "agency_id"
            description: "Agency ID"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "agency_id"
          - name: "route_name"
            description: "Route name"
            datatype: "VARCHAR"
            expression:
              dialects:
                - dialect: "ANSI_SQL"
                  expression: "route_name"

    relationships:
      - name: "micro_status_to_dim_stations"
        from: "fact_micromobility_status"
        to: "dim_micromobility_stations"
        from_columns:
          - "station_id"
          - "agency_id"
        to_columns:
          - "station_id"
          - "agency_id"
        type: "many_to_one"

    metrics:
      - name: "total_unique_alerts"
        description: "Count of distinct alert IDs"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "COUNT(DISTINCT fact_alerts.alert_id)"
      - name: "alerts_logged"
        description: "Count of alerts logged"
        datatype: "BIGINT"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "COUNT(fact_alerts.alert_id)"
      - name: "avg_bikes_available"
        description: "Average available bikes per station"
        datatype: "DOUBLE"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "AVG(fact_micromobility_status.num_bikes_available) FILTER (WHERE fact_micromobility_status.is_renting = true AND (fact_micromobility_status.num_bikes_available + fact_micromobility_status.num_docks_available) > 0)"
      - name: "avg_bikes"
        description: "Average available bikes"
        datatype: "DOUBLE"
        expression:
          dialects:
            - dialect: "ANSI_SQL"
              expression: "AVG(fact_micromobility_status.num_bikes_available) FILTER (WHERE fact_micromobility_status.is_renting = true AND (fact_micromobility_status.num_bikes_available + fact_micromobility_status.num_docks_available) > 0)"
