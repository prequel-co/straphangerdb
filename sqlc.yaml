version: "2"
sql:
  - schema: "internal/control/db/schema/001_control.sql"
    queries: "internal/control/db/queries/"
    engine: "sqlite"
    gen:
      go:
        package: "sqlc"
        out: "internal/control/db/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
